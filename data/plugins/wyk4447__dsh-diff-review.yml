name: dsh-diff-review
repo: wyk4447/dsh-diff-review
description:
  zh: 改动发生前先审查。模型要写、改、删文件时，右侧边栏弹出原文与新文的对比，点「接受」才真正落盘；支持命令级审查、多文件逐格、就地改写、按轮还原与按会话关闭。
  en: Review file changes before they happen. When the model is about to write, edit, or delete a file, the sidebar shows a before/after diff and nothing lands until you accept. Includes command-level review, per-file tabs, in-place rewriters, per-turn restore, and a per-conversation off switch.
